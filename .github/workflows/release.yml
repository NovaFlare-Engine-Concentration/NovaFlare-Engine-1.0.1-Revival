name: Release

on:
  workflow_dispatch:
    inputs:
      version_input:
        description: '输入格式为"版本名 版本号"，例如：1.2.0-Dev 2.7'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  mobile-build:
    name: "Mobile Build (macOS 14)"
    needs: update-versions
    uses: ./.github/workflows/MobileBuild.yml
    with:
      dependencies_to_update: 'all'
    secrets: inherit

  macos-build:
    name: "macOS Build"
    needs: mobile-build
    uses: ./.github/workflows/MacBuild.yml
    secrets: inherit

  windows-build:
    name: "Windows Build"
    needs: update-versions
    uses: ./.github/workflows/WindowsBuild.yml
    secrets: inherit

  linux-build:
    name: "Linux Build"
    needs: update-versions
    uses: ./.github/workflows/LinuxBuild.yml
    secrets: inherit

  releaser:
    name: "Create Release"
    needs: [update-versions, mobile-build, macos-build, windows-build, linux-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: androidBuild
          path: artifacts/

      - name: Download iOS Build
        uses: actions/download-artifact@v4
        with:
          name: iOSBuild
          path: artifacts/

      - name: Download macOS14 Build
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-14
          path: artifacts/

      - name: Download macOS15 Build
        uses: actions/download-artifact@v4
        with:
          name: macOSBuild-15
          path: artifacts/

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windowsBuild
          path: artifacts/

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: LinuxBuild
          path: artifacts/

      - name: List downloaded artifacts
        run: |
          find artifacts/ -type f -name "*" | sort
          echo "Total files found:"
          find artifacts/ -type f -name "*" | wc -l

      - name: Publish The Release
        uses: softprops/action-gh-release@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          prerelease: false
          tag_name: "V${{ needs.update-versions.outputs.version_name }}"
          name: "V${{ needs.update-versions.outputs.version_name }}"
          files: |
            artifacts/*.zip
          allowUpdates: true
